[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ecindex"
dynamic = ["version"]
description = "Add a short description here"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "Felipe Simon", email = "felipesimon.42@gmail.com" }]
keywords = []
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]
dependencies = [
    "numpy>=1.21",
    "lifelines>=0.27",
]

[project.optional-dependencies]
dev = [
    "pytest>=7",
    "pytest-cov>=4",
    "ruff>=0.6",
    "mypy>=1.8",
]

notebook = [
    "ipykernel>=6",
]

[project.urls]
Homepage = "https://github.com/felipesimon/ecindex"
Issues = "https://github.com/felipesimon/ecindex/issues"

[tool.hatch.version]
path = "src/ecindex/__about__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/ecindex"]

[tool.pytest.ini_options]
minversion = "7.0"
addopts = "-ra --strict-markers"
testpaths = ["tests"]

[tool.ruff]
line-length = 88
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "NPY"]

[tool.mypy]
files = ["src"]
strict = true
